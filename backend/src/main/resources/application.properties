spring.application.name=mandalink-api
server.port=${PORT:8080}

# Database - Render provides DATABASE_URL for Postgres.
# Falls back to local H2 file DB for development if not set.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/mandalink-dev}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS - set to your Render static site URL in production via env var
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# JWT
app.jwt.secret=${JWT_SECRET:mandalink-dev-secret-change-in-production-please-0123456789}
app.jwt.expiration-ms=604800000

# Groq (AI Help)
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
